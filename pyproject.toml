[project]
name = "consumo-dados-ibge"
version = "0.1.0"
description = ""
authors = [{ name = "BRunknown", email = "asafe.ferr@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "hishel (>=1.1.9,<2.0.0)",
    "httpx-retries (>=0.4.5,<0.5.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-env (>=1.2.0,<2.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "respx (>=0.22.0,<0.23.0)",
]

[tool.pytest_env]

RESPONSE_SAVE_PATH = ""

[tool.pytest.ini_options]

pythonpath = ["src"]

tmp_path_retention_policy = "failed"
